[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codem"
version = "0.1.0"
description = "A terminal-first deterministic AI coding agent"
requires-python = ">=3.10"
dependencies = [
    "typer[all]",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
codem = "codem.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
